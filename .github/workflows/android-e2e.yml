name: Android Appium E2E Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apppp/android/**'
      - 'BrainBattleAppium/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android_e2e:
    name: Mobile E2E (1,111 Appium Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build Debug APK ─────────────────────────────────────
      - name: Build Android Debug APK
        working-directory: apppp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleStagingDebug --no-daemon
          APK_REL_PATH=$(find . -name '*-debug.apk' -type f | head -1 | sed 's|^\./||')
          if [ -z "$APK_REL_PATH" ]; then
            echo "❌ APK build failed or APK not found!"
            exit 1
          fi
          echo "APK_PATH=$APK_REL_PATH" >> $GITHUB_ENV

      # ── Install Appium Dependencies ─────────────────────────
      - name: Install Appium & Test Dependencies
        working-directory: BrainBattleAppium
        run: |
          npm install
          npx appium driver install uiautomator2

      # ── Enable KVM ──────────────────────────────────────────
      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── Run Appium Tests in Emulator ────────────────────────
      - name: Run Appium Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          profile: Nexus 6
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd BrainBattleAppium
            chmod +x scripts/ci_run_tests.sh
            export APK_PATH="${{ github.workspace }}/apppp/android/${{ env.APK_PATH }}"
            bash scripts/ci_run_tests.sh

      # ── Upload Test Reports ─────────────────────────────────
      - name: Upload Mobile Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-reports-build-${{ github.run_number }}
          path: |
            BrainBattleAppium/Test_Results/
          retention-days: 30

      # ── Check if HTML Report Exists ──────────────────────────
      - name: Check HTML Report
        id: check_html
        if: always()
        run: |
          if [ -d "BrainBattleAppium/Test_Results/HTML" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ── Deploy Reports to GH Pages ─────────────────────────
      - name: Deploy Mobile Reports to GitHub Pages
        if: steps.check_html.outputs.exists == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: BrainBattleAppium/Test_Results/HTML
          target-folder: reports/mobile/latest
          branch: gh-pages
          clean: false

      - name: Deploy Mobile Report History
        if: steps.check_html.outputs.exists == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: BrainBattleAppium/Test_Results/HTML
          target-folder: reports/mobile/history/build-${{ github.run_number }}
          branch: gh-pages
          clean: false

      # ── Step Summary ────────────────────────────────────────
      - name: Write Step Summary
        if: always()
        run: |
          if [ -f "BrainBattleAppium/Test_Results/HTML/execution-report.html" ]; then
            echo "## 📱 Mobile E2E Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Reports uploaded as artifacts and deployed to GitHub Pages." >> $GITHUB_STEP_SUMMARY
          fi
          # Run summary generator
          if [ -f "BrainBattleAppium/utils/generateSummary.js" ]; then
            cd BrainBattleAppium && node utils/generateSummary.js
          fi
