name: Web E2E Tests & Pages Deployment

on:
  push:
    branches: [ main, master ]
    paths:
      - 'nextjs_app/**'
      - 'BrainBattleE2E/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  e2e_test_and_deploy:
    name: Web E2E (1,100 Tests) + Pages Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextjs_app/package-lock.json

      # ── Build Next.js Frontend ──────────────────────────────
      - name: Install Frontend Dependencies
        working-directory: nextjs_app
        run: npm ci

      - name: Build Next.js App
        working-directory: nextjs_app
        run: npm run build

      # ── Start Local Preview Server ──────────────────────────
      - name: Start Preview Server
        run: |
          npx -y serve@latest nextjs_app/out -l 5173 --single &
          sleep 4
          curl -sf http://127.0.0.1:5173 > /dev/null && echo "✅ Preview server is alive" || echo "⚠️ Server not responding"
          echo "TEST_BASE_URL=http://127.0.0.1:5173" >> $GITHUB_ENV

      # ── Start Backend API ───────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Start Python Backend
        working-directory: apppp/backend
        run: |
          pip install -r requirements.txt
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          curl -sf http://127.0.0.1:8000/health > /dev/null && echo "✅ Backend is alive" || echo "⚠️ Backend not responding"

      # ── Install E2E Dependencies ────────────────────────────
      - name: Install E2E Dependencies
        working-directory: BrainBattleE2E
        run: npm install

      - name: Install Chrome for Testing
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── Run 1,100 Web E2E Tests ─────────────────────────────
      - name: Execute Web E2E Test Suite (1,100 Tests)
        working-directory: BrainBattleE2E
        env:
          TEST_BASE_URL: ${{ env.TEST_BASE_URL }}
        run: |
          npx mocha tests/mega_web_1100.test.js --timeout 120000 --exit --reporter spec 2>&1 | tee test-output.log
          echo "✅ E2E test suite completed"

      # ── Run Web Security Scan ───────────────────────────────
      - name: Run Web Security Scanner
        working-directory: BrainBattleE2E
        env:
          NODE_PATH: ${{ github.workspace }}/BrainBattleE2E/node_modules
        run: |
          node scripts/generateWebSecuritySuite.js
          echo "✅ Web security scan completed"

      # ── Inject Reports into Dist ────────────────────────────
      - name: Inject E2E Reports into Build Output
        run: |
          DIST_DIR="nextjs_app/out"
          mkdir -p "$DIST_DIR/reports/latest"
          mkdir -p "$DIST_DIR/reports/history/build-${{ github.run_number }}"

          # Copy HTML report
          if [ -f "BrainBattleE2E/Test_Results/HTML/execution-report.html" ]; then
            cp BrainBattleE2E/Test_Results/HTML/execution-report.html "$DIST_DIR/reports/latest/execution-report.html"
            cp BrainBattleE2E/Test_Results/HTML/execution-report.html "$DIST_DIR/reports/history/build-${{ github.run_number }}/execution-report.html"
            echo "✅ E2E HTML report injected"
          fi

          # Copy security reports
          if [ -d "BrainBattleE2E/Security_Results" ]; then
            cp -r BrainBattleE2E/Security_Results "$DIST_DIR/reports/latest/security/"
            echo "✅ Security reports injected"
          fi

      # ── Upload Test Artifacts ───────────────────────────────
      - name: Upload E2E Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-reports-build-${{ github.run_number }}
          path: |
            BrainBattleE2E/Test_Results/
            BrainBattleE2E/Security_Results/
          retention-days: 30

      # ── Deploy to GitHub Pages ──────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nextjs_app/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ── Step Summary ────────────────────────────────────────
      - name: Write Step Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🧬 BioPolymer AI — Web E2E Test Results

          ## Test Suite: 1,100 Selenium Assertions
          - **110 Categories** across 11 testing types
          - **Headless Chrome** execution

          ## Reports
          - 📊 [Excel Report](artifact: web-e2e-reports-build-${{ github.run_number }})
          - 📄 [HTML Execution Report](${{ steps.deployment.outputs.page_url }}reports/latest/execution-report.html)

          ## Build Info
          | Field | Value |
          |-------|-------|
          | Build Number | ${{ github.run_number }} |
          | Commit | ${{ github.sha }} |
          | Branch | ${{ github.ref_name }} |
          | Triggered by | ${{ github.actor }} |
          EOF
