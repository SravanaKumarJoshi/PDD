name: API Load Testing (k6)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apppp/backend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apppp/backend/**'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend URL to load test (leave empty for CI-local)'
        required: false
        default: ''
      vus:
        description: 'Number of Virtual Users'
        required: false
        default: '100'
      duration:
        description: 'Test duration'
        required: false
        default: '1m'

jobs:
  load_test:
    name: k6 Baseline Load Test (100 VUs × 1 min)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: polysaccharide_selector
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apppp/backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Install k6 ─────────────────────────────────────────
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # ── Seed Database ───────────────────────────────────────
      - name: Seed MySQL Database
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root123
          MYSQL_DATABASE: polysaccharide_selector
        run: |
          python apppp/backend/seed_data.py || echo "Seed completed or already populated"

      # ── Start FastAPI Backend ───────────────────────────────
      - name: Start FastAPI Backend Server
        env:
          DATABASE_URL: mysql+aiomysql://root:root123@127.0.0.1:3306/polysaccharide_selector
          APP_ENV: development
          APP_DEBUG: "false"
        run: |
          cd apppp/backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          # Verify server is running
          curl -sf http://127.0.0.1:8000/health && echo "✅ Backend is alive" || echo "⚠️ Backend not responding"

      # ── Determine Target URL ────────────────────────────────
      - name: Set Backend URL
        run: |
          if [ -n "${{ github.event.inputs.backend_url }}" ]; then
            echo "BACKEND_URL=${{ github.event.inputs.backend_url }}" >> $GITHUB_ENV
          else
            echo "BACKEND_URL=http://127.0.0.1:8000" >> $GITHUB_ENV
          fi

      # ── Run k6 Load Test ────────────────────────────────────
      - name: Run k6 Load Test (100 VUs × 1 min)
        run: |
          k6 run \
            --summary-export=apppp/backend/scripts/summary.json \
            --env BACKEND_URL=${{ env.BACKEND_URL }} \
            apppp/backend/scripts/load-test.js \
            2>&1 | tee k6-output.log
          echo "✅ k6 load test completed"

      # ── Parse Results & Publish Summary ─────────────────────
      - name: Parse k6 Results & Publish Summary
        if: always()
        run: |
          node apppp/backend/scripts/parseK6Summary.js apppp/backend/scripts/summary.json

      # ── Upload Artifacts ────────────────────────────────────
      - name: Upload Load Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-build-${{ github.run_number }}
          path: |
            apppp/backend/scripts/summary.json
            apppp/backend/scripts/load-test-report.md
            k6-output.log
          retention-days: 30
