name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

# Cancel any in-progress run for the same branch/PR to save runner minutes.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Unit + integration tests
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biopolymer
          POSTGRES_PASSWORD: biopolymer
          POSTGRES_DB: biopolymer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # -------------------------------------------------------------------------
    # Environment — mirrors the "test" profile in config.py.
    # Secrets are stored in GitHub repository/org secrets and never hardcoded.
    # -------------------------------------------------------------------------
    env:
      APP_ENV: test
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://biopolymer:biopolymer@localhost:5432/biopolymer_test
      # A placeholder admin token is acceptable in the test environment because
      # config.py only raises on unsafe tokens in staging/production.
      ADMIN_TOKEN: ci-test-token-not-for-production
      # CORS is irrelevant for unit tests but must be a valid JSON list.
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Firebase is mocked in tests; the project ID just needs to be non-empty.
      FIREBASE_PROJECT_ID: test-project

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U biopolymer && break
            echo "Waiting for Postgres... ($i/30)"
            sleep 1
          done
          pg_isready -h localhost -p 5432 -U biopolymer || exit 1

      - name: Run unit tests with coverage
        working-directory: backend
        run: |
          python -m pytest tests/ -v --tb=short \
            -m "not integration" \
            --cov=app --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=85

      - name: Run integration tests
        working-directory: backend
        env:
          TEST_DB_AVAILABLE: "true"
        run: python -m pytest tests/ -v --tb=short -m integration

      - name: Run dataset evaluation
        working-directory: backend
        run: python evaluate_dataset.py --output evaluation_report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: backend/evaluation_report.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov/

  # ---------------------------------------------------------------------------
  # Linting — runs in parallel with tests (doesn't need Postgres).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.2.2

      - name: Lint check
        working-directory: backend
        run: ruff check .

      - name: Format check
        working-directory: backend
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Docker image build — validates the Dockerfile and confirms the image
  # starts cleanly.  Only runs after tests pass.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: backend
        run: docker build -t biopolymer-api:ci .

      - name: Smoke-test container startup
        # Start the container with test environment variables and verify
        # the /health endpoint responds within 30 seconds.
        run: |
          docker run --rm -d \
            --name biopolymer-api-smoke \
            -p 8000:8000 \
            -e APP_ENV=test \
            -e APP_DEBUG=true \
            -e DATABASE_URL="postgresql+asyncpg://biopolymer:biopolymer@localhost:5432/biopolymer_test" \
            -e ADMIN_TOKEN="ci-smoke-token" \
            -e CORS_ORIGINS='["http://localhost:3000"]' \
            -e FIREBASE_PROJECT_ID="test-project" \
            biopolymer-api:ci

          # Poll /health until it returns 200 or we time out.
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              break
            fi
            echo "Waiting for API... (attempt $i, status=$STATUS)"
            sleep 1
          done

          [ "$STATUS" = "200" ] || (docker logs biopolymer-api-smoke; exit 1)
          docker stop biopolymer-api-smoke
