# =============================================================================
# docker-compose.yml — Development environment
# =============================================================================
# Usage:
#   docker compose up --build
#
# The .env file in this directory is loaded automatically.  Copy .env.example
# to .env and fill in values before starting.
#
# For production, use docker-compose.prod.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — application data (users, projects, etc.)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biopolymer
      POSTGRES_PASSWORD: biopolymer
      POSTGRES_DB: biopolymer
    ports:
      # Expose on localhost only so the database is not reachable externally.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biopolymer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # In development the API is reachable at:
      #   http://localhost:8000  (browser / curl on the host)
      #   http://10.0.2.2:8000  (Android emulator → host machine)
      # Binding to 0.0.0.0 (no explicit host IP) is required for the emulator
      # because it reaches the host via the 10.0.2.2 virtual adapter, not the
      # loopback address.  Using "127.0.0.1:8000:8000" would block emulator
      # access and cause Android to report "CLEARTEXT communication not permitted".
      # In production this port is NOT published directly — a reverse proxy
      # (nginx/caddy) terminates TLS and forwards to the container.
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL so the API container reaches the db service by
      # its Docker network name, not "localhost".
      DATABASE_URL: postgresql+asyncpg://biopolymer:biopolymer@db:5432/biopolymer
      APP_ENV: development
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source for hot-reload in development.
      - .:/app
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir app
        --timeout-keep-alive 75
        --timeout-graceful-shutdown 30
    restart: unless-stopped

volumes:
  pgdata:
