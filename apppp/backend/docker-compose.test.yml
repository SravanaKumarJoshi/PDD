services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biopolymer
      POSTGRES_PASSWORD: biopolymer
      POSTGRES_DB: biopolymer_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biopolymer"]
      interval: 5s
      timeout: 3s
      retries: 5
